[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "experimental-ml-framework"
version = "0.1.0.dev0"
description = "A rigorous, reproducible experimentation framework for tabular machine learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alexandre Rangel" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
expml = "experimental_ml.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experimental_ml"]

